name: Docker CI/CD Pipeline

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        pytest test_app.py -v

  security-scan:
    name: Security Scan with Checkov
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Checkov
      run: |
        pip install checkov
    
    - name: Run Checkov scan on Dockerfile
      run: |
        checkov -f Dockerfile --compact --quiet || true
    
    - name: Run Checkov scan on entire directory
      run: |
        checkov -d . --compact --quiet || true

  build-and-test-docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t flask-app:latest .
    
    - name: Start Docker container
      run: |
        docker run -d -p 5000:5000 --name flask-app-test flask-app:latest
    
    - name: Wait for container to be ready
      run: |
        echo "Waiting for container to be healthy..."
        for i in {1..30}; do
          if docker inspect --format='{{.State.Health.Status}}' flask-app-test 2>/dev/null | grep -q "healthy"; then
            echo "Container is healthy!"
            break
          fi
          if docker inspect --format='{{.State.Status}}' flask-app-test 2>/dev/null | grep -q "running"; then
            echo "Container is running, waiting for health check... (attempt $i/30)"
            sleep 2
          else
            echo "Container is not running!"
            exit 1
          fi
        done
    
    - name: Check container is running
      run: |
        docker ps | grep flask-app-test
    
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Test Docker container accessibility
      run: |
        python test_docker_deployment.py
    
    - name: Show container logs
      if: always()
      run: |
        docker logs flask-app-test
    
    - name: Stop and remove container
      if: always()
      run: |
        docker stop flask-app-test || true
        docker rm flask-app-test || true

  heroku-deploy:
    name: Deploy to Heroku (Optional)
    runs-on: ubuntu-latest
    needs: build-and-test-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Heroku
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
      run: |
        echo "Heroku deployment would happen here"
        echo "To enable: Add HEROKU_API_KEY and HEROKU_APP_NAME secrets to repository"
        echo "App would be deployed to: https://$HEROKU_APP_NAME.herokuapp.com"
